services:
  database:
    image: postgres:16-alpine
    container_name: hmti_db
    environment:
      POSTGRES_USER: ${user}
      POSTGRES_PASSWORD: ${pass}
      POSTGRES_DB: ${name}
    ports:
      - "${port}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: